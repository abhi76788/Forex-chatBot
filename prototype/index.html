<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forex Travel Chatbot Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Forex Travel Chatbot (Prototype)</h1>
      <p class="subtitle">
        Ask questions about currency exchange, cards, cash, and travel forex tips.
      </p>

      <section id="chat-window" class="chat-window" aria-live="polite">
        <div class="message bot">
          Hi! I’m your Forex Travel Assistant. Ask me things like:
          <ul>
            <li>“Should I carry cash or card abroad?”</li>
            <li>“How can I avoid exchange fees?”</li>
            <li>“What documents are needed for forex?”</li>
          </ul>
        </div>
      </section>

      <form id="chat-form" class="chat-form">
        <input
          id="user-input"
          type="text"
          placeholder="Type your forex question..."
          required
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </main>

    <script src="./chatbot.js"></script>
  </body>
</html>
